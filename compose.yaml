version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base 
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && yarn install && ./bin/dev"
    volumes:
      - .:/rails 
      - bundle_cache:/usr/local/bundle 
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=sqlite3:/rails/storage/development.sqlite3
    
    userns_mode: keep-id

volumes:
  bundle_cache: